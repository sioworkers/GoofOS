name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-multilib qemu-system-x86

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Upload Image
        uses: actions/upload-artifact@v7
        with:
          name: goofos.img
          path: build/goofos.img
